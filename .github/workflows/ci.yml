name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfuse3-dev libdbus-1-dev
      - name: Build
        run: make
