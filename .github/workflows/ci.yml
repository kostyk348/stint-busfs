name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build (release)
        run: cargo build --release

      # no D-Bus / /dev/fuse on runners: the binary must still be usable,
      # report demo mode honestly and never hang
      - name: Smoke: CLI
        run: |
          ./target/release/stint-busfs --version
          ./target/release/stint-busfs mount --help
          timeout 30 ./target/release/stint-busfs list || test $? -eq 1
